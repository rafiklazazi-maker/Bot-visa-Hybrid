name: Bot Visa Surveillance 24-7

on:
  schedule:
    # S'exécute automatiquement toutes les heures
    - cron: '0 * * * *'
  workflow_dispatch: # Permet de le lancer manuellement quand tu veux depuis GitHub

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer Google Chrome (pour Selenium)
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Installer les dépendances (requirements.txt)
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lancer le bot de visa
        run: python bot.py